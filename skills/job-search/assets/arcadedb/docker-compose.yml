services:
  arcadedb:
    image: arcadedata/arcadedb:latest
    container_name: arcadedb
    ports:
      - "2480:2480" # HTTP REST API
      - "2424:2424" # Binary protocol
    volumes:
      - arcadedb-data:/home/arcadedb/databases
    environment:
      - JAVA_OPTS=-Darcadedb.server.rootPassword=playwithdata
    # "no" (not unless-stopped): the skill starts this on demand and an idle
    # timer stops it, so it should not auto-resurrect on reboot or after a stop.
    # See scripts/arcadedb_ctl.sh.
    restart: "no"

volumes:
  arcadedb-data:
